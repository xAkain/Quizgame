<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screenActive" id="startScreen">
            <h1>Quiz Time!</h1>
            <p>Test your knowledge with these fun questions</p>
            <button id="startBtn">Start Quiz</button>

        </div>
        <div class="Screen" id="quizScreen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here!</h2>
                <div class="Ques-info">
                    <p>
                        Question <span id="Current Question">1</span>of <span id="total-questions">5</span>
                    </p>
                    <p>
                      Score:<span id="score">0</span>
                    </p>

                </div>
            </div>
            <div id="answercontainer" class="answercontainer">
               <!--  Answers will be posted here  -->
            </div>
            <div id="progress-bar">
                <div id="progress" class="progress">

                </div>
            </div>
        </div>
        <div id="Result-Screen" class="screen">
            <h1>Quiz results</h1>
            <div class="result-info">
                <p>
                You scored <span id="final-score">0</span> out of <span id="max-score"> 5</span>
                </p>

                <div id="resultmsg">Good job!</div>

            </div>
            <button id="restartBtn">Restart Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
